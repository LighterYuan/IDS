# CICFlowMeter配置文件

[Settings]
# 输出文件格式 (CSV 或 ARFF)
output_format = CSV

# 流超时时间（秒）
flow_timeout = 120

# 活动超时时间（秒）
activity_timeout = 5

# 最大流数量
max_flows = 50000

# 是否识别TCP子流
identify_subflows = true

# 是否忽略不完整的TCP流
ignore_incomplete_flows = false

[Features]
# 基本特征
src_ip = true
src_port = true
dst_ip = true
dst_port = true
protocol = true
timestamp = true
flow_duration = true
total_fwd_packets = true
total_bwd_packets = true
total_length_of_fwd_packets = true
total_length_of_bwd_packets = true

# 统计特征
fwd_packet_length_max = true
fwd_packet_length_min = true
fwd_packet_length_mean = true
fwd_packet_length_std = true
bwd_packet_length_max = true
bwd_packet_length_min = true
bwd_packet_length_mean = true
bwd_packet_length_std = true
flow_bytes_per_s = true
flow_packets_per_s = true

# 高级特征
fwd_header_length = true
bwd_header_length = true
fwd_packets_per_s = true
bwd_packets_per_s = true
packet_length_min = true
packet_length_max = true
packet_length_mean = true
packet_length_std = true
packet_length_variance = true
fin_flag_count = true
syn_flag_count = true
rst_flag_count = true
psh_flag_count = true
ack_flag_count = true
urg_flag_count = true
ece_flag_count = true
down_up_ratio = true
avg_packet_size = true
avg_fwd_segment_size = true
avg_bwd_segment_size = true
fwd_header_length = true
fwd_avg_bytes_per_bulk = true
fwd_avg_packets_per_bulk = true
fwd_avg_bulk_rate = true
bwd_avg_bytes_per_bulk = true
bwd_avg_packets_per_bulk = true
bwd_avg_bulk_rate = true

[Labels]
# 流量标签
normal = 0
dos = 1
scan = 2
bruteforce = 3
infiltration = 4
botnet = 5 